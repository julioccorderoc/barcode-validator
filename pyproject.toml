[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barcode_validator"]

[project]
name = "barcode-validator"
version = "0.1.0"
description = "Automated barcode validation for label proofs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.2",
    "zxing-cpp>=3.0.0",
]

[project.scripts]
barcode-validator = "barcode_validator.cli:main"

[project.optional-dependencies]
pyzbar = ["pyzbar"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "network: tests that require internet access (deselect with '-m not network')",
]
